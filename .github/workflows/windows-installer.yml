# Builds the Windows installer on GitHub's Windows machines, so you don't need a Windows PC
# to make it. Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0.
# Download SuperBistro-*.exe and the portable zip from the run's "Artifacts" section.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also put the exe on this GitHub Release (e.g. v1.0.0); leave empty to skip"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: WiX Toolset 3 (needed by jpackage for .exe; usually already on the runner)
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            if (-not $wix) { choco install wixtoolset -y --no-progress; $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1 }
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
        shell: pwsh

      - name: Ready-made admin login (kept out of the public code)
        shell: pwsh
        env:
          DEFAULT_ADMIN: ${{ secrets.DEFAULT_ADMIN_LOGIN }}
        run: |
          if ($env:DEFAULT_ADMIN) { "login=$env:DEFAULT_ADMIN" | Out-File -FilePath src\main\resources\seed\admin.properties -Encoding ascii }

      - name: Build and test the app
        run: .\mvnw.cmd -B package
        shell: cmd

      - name: Build installer and portable zip
        run: |
          call packaging\windows\build-installer.bat
        shell: cmd

      - name: Smoke test the packed app (small Java runtime + built-in database on Windows)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "sb-smoke"
          $env:DATA_DIR = $data; $env:PORT = "18080"
          $p = Start-Process -FilePath "dist\portable\SuperBistro\SuperBistro.exe" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\sb-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\sb-err.txt"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod -Uri "http://localhost:18080/api/auth/config" -TimeoutSec 3; if ($r.firstStart) { $ok = $true; break } } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process postgres -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\sb-out.txt" -Tail 80; Get-Content "$env:RUNNER_TEMP\sb-err.txt" -Tail 40; throw "Super Bistro did not start from the packed app" }
          "Packed app started and served the login page."
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: SuperBistro-windows
          path: |
            dist/SuperBistro-Setup.exe
            dist/SuperBistro-portable.zip

      - name: Put the files on the GitHub Release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title "Super Bistro $env:TAG" --notes "Windows installer" }
          gh release upload $env:TAG dist\SuperBistro-Setup.exe dist\SuperBistro-portable.zip --clobber
